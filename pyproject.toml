[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleloop"
version = "0.1.0"
description = "A minimal serial LLM optimization loop: proposer -> executor -> judger."
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.1", "matplotlib>=3.5"]

[project.scripts]
simpleloop = "simpleloop.cli:main"

[tool.setuptools.packages.find]
include = ["simpleloop*"]

[tool.setuptools.package-data]
simpleloop = ["prompts/*.md"]
