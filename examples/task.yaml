schema: simpleloop.v1
goal: >
  State what to optimize, where it lives, and the correctness constraint. The
  proposer reads this verbatim, so name the hot code, objective, and gates.
loop:
  max_rounds: 10
  candidates_per_round: 1
  max_parallel_candidates: 1
source:
  repo: ../../path/to/your/repo
  baseline: HEAD
world:
  image: apptainer.sif
  writable:
  - src
  - build
evaluation:
  commands:
  - python -m pytest -q tests/
  objective:
    key: SPEED_MS
    direction: minimize
  gates:
  - key: CORRECTNESS
    description: >
      Explain what this gate measures and what kind of change makes it fail.
providers:
  sandbox:
    kind: apptainer
    userns: true
  scheduler:
    kind: local
proposer:
  api: hepai
  model: gpt-5.5
  base_url: https://aiapi.ihep.ac.cn/apiv2
  command_timeout_seconds: 120
  command_output_cap_chars: 12000
  max_steps: 200
executor:
  api: anthropic
  model: glm-5
  base_url: https://open.bigmodel.cn/api/anthropic
rsi:
  enabled: false
