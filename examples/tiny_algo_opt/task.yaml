kind: task

task:
  goal: >
    Optimize the tinyalgo pair-counting implementation in tinyalgo/__init__.py for
    speed (lower ms_per_call) while keeping results exactly correct: the pytest
    suite and scripts/check_drift.py must still pass. Edit only tinyalgo source.

safety:
  editable_paths:
    - "tinyalgo/**/*.py"
  frozen_paths:
    - "tests/**"
    - "scripts/**"
    - "benchmarks/**"
    - "README.md"
    - "pyproject.toml"

loop:
  max_rounds: 4
  candidates_per_round: 2
  max_workers: 2

self_improvement:
  interval_rounds: 6

researcher:
  api: hepai
  model: gpt-5.5
  base_url: https://aiapi.ihep.ac.cn/apiv2
  max_steps: 50
  command_timeout_seconds: 120
  command_output_cap_chars: 12000

runtime:
  image: apptainer.sif
  binds: []

# The harness runs these after each commit and parses their stdout.
# correctness + drift are hard gates (must pass); bench is the speed signal.
eval:
  commands:
    - "PYTHONPATH=. python -m pytest tests/ -q && echo CORRECTNESS=PASS || echo CORRECTNESS=FAIL"
    - "PYTHONPATH=. python scripts/check_drift.py && echo DRIFT=PASS || echo DRIFT=FAIL"
    - "PYTHONPATH=. python scripts/bench.py"
  metrics:
    objective:
      key: ms_per_call
      lower_is_better: true
    gates:
      - key: CORRECTNESS
        description: >
          The pytest suite passes. Pair counts must be exactly correct — a change
          that alters any computed count fails.
      - key: DRIFT
        description: >
          Per-call output bit-identical to a frozen reference (scripts/check_drift.py).
          Any change to op order, accumulation, or control flow that shifts the
          result fails.

source:
  path: repo
  baseline_ref: HEAD
