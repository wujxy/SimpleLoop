[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyalgo"
version = "0.1.0"
description = "Tiny pair-counting algo — optimization target for SimpleLoop example."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["tinyalgo*"]
