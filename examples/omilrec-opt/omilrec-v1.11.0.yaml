schema: simpleloop.v1
goal: 'Optimize the speed of the OMILRECV2 reconstruction algorithm under OMILRECV2/src/. Lower OMILRECV2
  ms/event while keeping the FCN numerical drift <= 1e-13 (test_fcn must stay 16/16 PASS) and the e2e
  reconstruction within 4 mm / 7 keV. Edit only the admitted source files. The hot code is OMILRECV2/src/omilrec_fcn.cc
  (Calculate_EVLikelihood, the Minuit objective) and OMILRECV2/src/omilrec_likelihood.cc (qmle_unfired_ll
  / qmle_fired_ll / tmle_ll). Any arithmetic change inside the FCN is amplified by Minuit — a sub-ULP
  difference can flip a degenerate event''s basin — so prefer bit- identical refactors (hoisting, caching,
  index partitioning) over precision changes. See CLAUDE.md "FCN Idempotency" for the rules.

  '
loop:
  max_rounds: 4
  candidates_per_round: 1
  max_parallel_candidates: 1
source:
  repo: ../../../omilrec
  baseline: main
world:
  image: ../junosw-apptainer.sif
  writable:
  - OMILRECV2/src
  - OMILRECV2/python
  - CMakeLists.txt
  - OMILRECV2/CMakeLists.txt
  - build
  - build-asan
  - InstallArea
  - TEMP
  definition: ../junosw-apptainer.def
  external_writable:
  - /cvmfs
  - /data/juno
  - /datafs/users/wujxy/agent-sci/omilrec_opt
evaluation:
  commands:
  - bash scripts/sl_eval.sh --evtmax 10
  objective:
    key: SPEED_MS
    direction: minimize
  gates:
  - key: FCN
    description: 'FCN numerical drift gate: test_fcn replays the golden FCN values and must stay 16/16
      PASS (relative drift <= 1e-13). A FAIL vetoes the round regardless of measured speed.

      '
providers:
  sandbox:
    kind: apptainer
    userns: true
  scheduler:
    kind: local
proposer:
  api: hepai
  model: gpt-5.5
  base_url: https://aiapi.ihep.ac.cn/apiv2
  command_timeout_seconds: 120
  command_output_cap_chars: 12000
  max_steps: 200
executor:
  api: anthropic
  model: glm-5
  base_url: https://open.bigmodel.cn/api/anthropic
rsi:
  enabled: false
