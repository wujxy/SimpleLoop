# Static proposal smoke batch for SimpleLoop's --proposals mode.
#
# Contains proposals 1-4 from the total paper-reproduction set. This is meant
# for a short trial run before spending time on the full optimization sequence.

proposals:
  - |
    Reproduce the paper's first "data-layout flattening" step in OMILRECV2/src/OMILRECV2.{cc,h}: cache per-LPMT constants into contiguous member arrays during initialization or calibration load, including pmt x/y/z/R, isDyn, LPDE, LGain, LQ1, LQRes, timeOffset, and any stable dark-rate inputs. In Calculate_EVLikelihood, replace repeated ALL_LPMT_pos[i].X()/Y()/Z() and m_pmtpara_tool virtual getter calls with direct array reads. Preserve the exact arithmetic order inside likelihood terms and keep the change local to OMILRECV2/src.

  - |
    Cache raw ROOT histogram arrays once in Load_ExpectedPEQTime instead of repeatedly calling histogram accessors in the FCN. Add member arrays for nPE maps, average charge PDFs, and time-PDF arrays where available, then change Calculate_EVLikelihood and RecHelper call sites to pass/read raw arrays directly. Target the calls to InterpolateNPEMapTH1D/TH2F, InterpolateQPDFTH1D, InterpolateTimePDFTH1F/TH2F. Do not change interpolation formulas or binning rules.

  - |
    Split the geometry work in Calculate_EVLikelihood into bulk passes over contiguous scratch arrays. Add scratch arrays for cos_theta, theta_deg, dstn, and Rsp, then compute pmt dot products, acos(theta), and PMT-vertex distance in separate simple loops before the likelihood accumulation. The goal is to expose vectorizable homogeneous loops while keeping the same per-PMT values consumed by the original charge/time code.

  - |
    Hoist Minuit-invariant per-event quantities out of Calculate_EVLikelihood. After event input and dark-noise removal are complete, compute and cache PMT_Hit=charge/gain, hitTime, hitNPE, dmu, fdmu, LPDE-scaled constants, and reusable QPDF parameters once per event. Replace the corresponding recomputation inside every FCN call with reads from these event arrays. Keep stage-dependent behavior unchanged, especially after RemoveDN.
