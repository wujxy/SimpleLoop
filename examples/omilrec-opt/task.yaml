schema: simpleloop.v1
goal: 'Minimize reconstruction SPEED_MS while satisfying every configured gate. The current implementation
  is the starting artifact, not a constraint on the form or scale of a valid solution.

  '
loop:
  max_rounds: 40
  candidates_per_round: 3
  max_parallel_candidates: 3
source:
  repo: ../../../omilrec-v100
  baseline: main
world:
  image: ../junosw-apptainer.sif
  writable:
  - OMILRECV2/src
  - OMILRECV2/python
  - CMakeLists.txt
  - OMILRECV2/CMakeLists.txt
  - build
  - build-asan
  - InstallArea
  - TEMP
  definition: ../junosw-apptainer.def
  external_writable:
  - /cvmfs
  - /data/juno
  - /datafs/users/wujxy/agent-sci/omilrec_opt
evaluation:
  commands:
  - bash scripts/sl_eval.sh --evtmax 10
  objective:
    key: SPEED_MS
    direction: minimize
  gates:
  - key: CORRECTNESS
    description: 'All 15 reconstructed fields for 10 events are bit-identical to reference/ref_10evt.root
      (tolerance 0).

      '
  - key: EVAL_RESULT
    description: 'The eval script ran to completion and produced all metrics. Fails on build failure,
      timeout, or crash before gates could be measured.

      '
providers:
  sandbox:
    kind: apptainer
    userns: true
  scheduler:
    kind: local
proposer:
  api: hepai
  model: gpt-5.5
  base_url: https://aiapi.ihep.ac.cn/apiv2
  command_timeout_seconds: 120
  command_output_cap_chars: 12000
  max_steps: 200
executor:
  api: anthropic
  model: glm-5
  base_url: https://open.bigmodel.cn/api/anthropic
rsi:
  enabled: false
