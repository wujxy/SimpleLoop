kind: task

# ============================================================================
#  OMILREC v1.0.0 optimization — local-server edition of task_hints.yaml
#  ============================================================================
#  Adapted from task_hints.yaml (ihep-cluster) for direct execution on this
#  server (no HTCondor/hepjob). Key changes vs the ihep version:
#    - source.path       → omilrec-v100-gated (local repo, not omilrec-v100-opt-pkg)
#    - runtime.binds     → /data/juno + project storage (not /lustrefs/juno26/...)
#    - eval.commands     → RecMap defaults to /data/juno/dingxf/OMILREC_maps
#                          (the sl_eval_v100.sh default; no env override needed)
#    - execution         → local backend (no hepjob/HTCondor block)
#  Prerequisite: build the runtime image before first run:
#    simpleloop image build examples/junosw-apptainer.def \
#        --output examples/junosw-apptainer.sif
#  (or symlink an existing junosw-apptainer.sif from a sibling SimpleLoop)
# ============================================================================

task:
  goal: >
    Minimize reconstruction SPEED_MS while satisfying every configured gate.
    The current implementation is the starting artifact, not a constraint on
    the form or scale of a valid solution.

safety:
  editable_paths:
    - "OMILRECV2/src/**/*.cc"
    - "OMILRECV2/src/**/*.h"
  frozen_paths:
    - "tests/**"
    - "scripts/**"
    - "baseline/**"
    - "benchmarks/**"
    - "reference/**"
    - "CMakeLists.txt"
    - "OMILRECV2/CMakeLists.txt"
    - "pyproject.toml"
    - "docs/**"
    - "CLAUDE.md"
    - "README.md"
    - ".gitignore"

loop:
  max_rounds: 100
  candidates_per_round: 4
  max_workers: 4
  agent_timeout_seconds: 7200

# self_improvement:
#   interval_rounds: 10

roles:
  researcher:
    api: hepai
    model: gpt-5.5
    base_url: https://aiapi.ihep.ac.cn/apiv2
    max_steps: 50
    command_timeout_seconds: 120
    command_output_cap_chars: 12000
  executor:
    api: anthropic
    model: glm-5.2
    base_url: https://aiapi.ihep.ac.cn/apiv2

runtime:
  image: ../junosw-apptainer.sif
  definition: ../junosw-apptainer.def
  binds:
    - /cvmfs
    - /data/juno
    - /datafs/users/wujxy/agent-sci/omilrec_opt

eval:
  commands:
    # RecMap (4 LFS .root files, ~979MB) lives at /data/juno/dingxf/OMILREC_maps
    # and is shared read-only across all candidate/baseline worktrees instead of
    # being smudged (and duplicated) into each worktree. OMILRECV2_BENCH_RECMAP
    # defaults to OMILRECV2_TEST_RECMAP inside sl_eval_v100.sh, which in turn
    # defaults to /data/juno/dingxf/OMILREC_maps — so no env override is needed.
    # The path is visible inside the container because /data/juno is bound.
    - "bash scripts/sl_eval_v100.sh --evtmax 100"
  metrics:
    objective:
      key: SPEED_MS
      lower_is_better: true
    gates:
      - key: CONTRACT
        description: >
          The production FCN remains directly exercised and all frozen evaluator
          assets, thresholds, and checks remain intact.
      - key: FCN
        description: >
          Production OMILRECV2::Calculate_EVLikelihood produces exactly 16
          finite unique results with relative error below 1e-13 against the
          frozen v1.0.0 values.
      - key: CONSISTENCY
        description: >
          All 18 reconstructed events are finite and remain within 4 mm position,
          7 keV energy, 10 ps t0, and 0.1 PE peSum of the v1.0.0 references.
      - key: EVAL_RESULT
        description: >
          The complete evaluator, including both builds, tests, and benchmark,
          finishes successfully and emits every required metric.

source:
  path: ../../../omilrec-v100-gated
  baseline_ref: simpleloop-v100-gated-baseline

execution:
  backend: local
