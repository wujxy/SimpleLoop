kind: task

task:
  goal: >
    Optimize the OMILREC v1.0.0 production reconstruction under OMILRECV2/src
    by minimizing probe-free SPEED_MS. OMILREC v1.0.0 is the sole source of
    algorithm and numerical truth, and a candidate is usable only when
    CONTRACT, FCN, CONSISTENCY, and EVAL_RESULT all pass. Explore structural
    improvements such as invariant-work hoisting, repeated-value caching, SoA
    or other data-layout changes, allocation reduction, precomputation, index
    partitioning, and removal of demonstrably unused work. These suggestions
    are not exhaustive: inspect the production code and propose new
    code-grounded directions when justified.

    Treat the FCN path as rounding-sensitive. Reordering or reassociating
    reductions, changing floating-point types or casts, substituting nominally
    equivalent mathematical expressions, or folding constants may change the
    tested likelihood values. Prefer changes to fetching, layout, caching, and
    invariant work that preserve the tested production results, but do not
    assume the listed techniques are the only safe or useful directions.
    Arithmetic changes elsewhere remain possible when every gate passes. Do
    not weaken, regenerate, bypass, or replace the evaluator, fixtures,
    references, thresholds, or build wiring. Edit only the admitted source files.

safety:
  editable_paths:
    - "OMILRECV2/src/**/*.cc"
    - "OMILRECV2/src/**/*.h"
  frozen_paths:
    - "tests/**"
    - "scripts/**"
    - "baseline/**"
    - "benchmarks/**"
    - "reference/**"
    - "CMakeLists.txt"
    - "OMILRECV2/CMakeLists.txt"
    - "pyproject.toml"
    - "docs/**"
    - "CLAUDE.md"
    - "README.md"
    - ".gitignore"

loop:
  max_rounds: 10
  candidates_per_round: 3
  max_workers: 3
  agent_timeout_seconds: 4500
  proposer_recent_rounds: 2

researcher:
  api: hepai
  model: gpt-5.5
  base_url: https://aiapi.ihep.ac.cn/apiv2
  max_steps: 20
  command_timeout_seconds: 120
  command_output_cap_chars: 12000

runtime:
  image: ../junosw-apptainer.sif
  definition: ../junosw-apptainer.def
  binds:
    - /cvmfs
    - /lustrefs/juno26/users/lidian

eval:
  commands:
    # RecMap (4 LFS .root files, ~979MB) lives in the source pkg and is shared
    # read-only across all candidate/baseline worktrees instead of being
    # smudged (and duplicated) into each worktree. OMILRECV2_BENCH_RECMAP
    # defaults to OMILRECV2_TEST_RECMAP inside sl_eval_v100.sh, so one var
    # covers both the pytest gates and the benchmark. The path is visible
    # inside the container because /lustrefs/juno26/users/lidian is bound.
    - "OMILRECV2_TEST_RECMAP=/lustrefs/juno26/users/lidian/omilrec-v100-opt-pkg/assets/OMILREC_maps bash scripts/sl_eval_v100.sh --evtmax 10"
  metrics:
    objective:
      key: SPEED_MS
      lower_is_better: true
    gates:
      - key: CONTRACT
        description: >
          Protects the measuring system itself: the FCN test must remain linked
          directly to the production member, and the frozen numerical assets,
          thresholds, and complete evaluator structure must remain intact.
          Modifying, reducing, bypassing, or replacing any check, including
          introducing a second likelihood implementation for testing, fails
          this gate.
      - key: FCN
        description: >
          Evaluates the real production OMILRECV2::Calculate_EVLikelihood at
          QMLE, TMLE, QTMLE, and ENERGY for four fixed events. It requires
          exactly 16 finite unique results, each with relative error strictly
          below 1e-13 against frozen v1.0.0 truth. Reordering or reassociating
          reductions, changing floating-point types or casts, replacing
          mathematical expressions with nominally equivalent forms, or folding
          constants can change rounding and fail this gate.
      - key: CONSISTENCY
        description: >
          Requires all 18 reconstructed events to be finite and within the
          v1.0.0 end-to-end limits: Euclidean 3D position <= 4 mm, energy
          <= 7 keV, t0 <= 10 ps, and peSum <= 0.1 PE. Arithmetic and structural
          changes are allowed only when every reconstructed result remains
          within every limit.
      - key: EVAL_RESULT
        description: >
          Requires the complete evaluator to finish successfully: the
          probe-enabled build and tests, the probe-free production rebuild, and
          the benchmark. A build or test failure, crash, timeout, missing metric,
          or incomplete evaluator execution fails this gate.

source:
  path: ../../../omilrec-v100-opt-pkg 
  baseline_ref: simpleloop-v100-gated-baseline

execution:
  backend: hepjob
  hepjob:
    schedd_name: scheduler@pvm069.ihep.ac.cn
    accounting_group: JUNO.juno.default
    cpu_model: zen5
    memory_mb: 6000
    poll_seconds: 15
    max_attempts: 2
    run_timeout_seconds: 5400
