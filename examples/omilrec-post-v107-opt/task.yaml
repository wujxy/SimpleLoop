kind: task

# Independent OMILRECV2 experiment: start from v1.0.0 source, gate with
# post-v1.0.7 FCN fixture replay and relaxed reconstruction tolerances.

task:
  goal: >
    Optimize the speed of the v1.0.0 OMILRECV2 reconstruction algorithm under
    OMILRECV2/src/. Lower OMILRECV2 ms/event while keeping the post-v1.0.7
    FCN replay gate passing and the end-to-end reconstruction within 4 mm
    vertex, 7 keV energy, 10 ps t0, and 0.1 PE peSum tolerances. Edit only
    the admitted source files.

safety:
  editable_paths:
    - "OMILRECV2/src/**/*.cc"
    - "OMILRECV2/src/**/*.h"
  frozen_paths:
    - "tests/**"
    - "scripts/**"
    - "benchmarks/**"
    - "reference/**"
    - "CMakeLists.txt"
    - "OMILRECV2/CMakeLists.txt"
    - "pyproject.toml"
    - "docs/**"
    - "CLAUDE.md"
    - "README.md"
    - ".gitignore"

loop:
  max_rounds: 10
  candidates_per_round: 3
  max_workers: 3

eval:
  commands:
    - "bash scripts/sl_eval_post_v107.sh --evtmax 10"
  metrics:
    objective:
      key: SPEED_MS
      lower_is_better: true
    gates:
      - key: FCN
        description: >
          The likelihood value Minuit minimizes, replayed against the v1.0.7-rev1
          golden pack at 1e-13 drift. Any change to float op order/rounding in the
          likelihood code shifts the reduction and fails it.
      - key: CONSISTENCY
        description: >
          Reconstructed vertex/energy/t0/peSum of 4 events within 4mm/7keV/10ps/0.1PE
          of the v1.0.7-rev1 reference — the physics output, not bit-exact.
      - key: EVAL_RESULT
        description: >
          The eval script ran to completion and produced all metrics. Fails on build
          failure, timeout, or crash before gates could be measured.

source:
  path: ../../../omilrec-v100-postv107-gated   # real git repo, freshly-prepared gated package
  baseline_ref: postv107-gated-v100            # the prepared start commit
