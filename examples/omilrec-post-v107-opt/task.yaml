kind: task

# Independent OMILRECV2 experiment: start from v1.0.0 source, gate with
# post-v1.0.7 FCN fixture replay and relaxed reconstruction tolerances.

task:
  goal: >
    Optimize the speed of the v1.0.0 OMILRECV2 reconstruction algorithm under
    OMILRECV2/src/. Lower OMILRECV2 ms/event while keeping the post-v1.0.7
    FCN replay gate (1e-13 drift) and the end-to-end reconstruction within
    4 mm vertex, 7 keV energy, 10 ps t0, and 0.1 PE peSum tolerances.

    Both gates use PHYSICS tolerances (not bit-identical), allowing float op
    changes and code cleanup as long as the numerical results stay within range.
    Focus on: simplifying complex expressions, removing redundant calculations,
    dead code elimination, loop structure refactors, fixing awkward code patterns.
    The FCN code lives in OMILRECV2/src/omilrec_charge_ll.cc and
    omilrec_time_pdf.cc; reconstruction code lives in OMILRECV2/src/omilrec_reconstruction.cc.

    Edit only the admitted source files.

safety:
  editable_paths:
    - "OMILRECV2/src/**/*.cc"
    - "OMILRECV2/src/**/*.h"
  frozen_paths:
    - "tests/**"
    - "scripts/**"
    - "benchmarks/**"
    - "reference/**"
    - "CMakeLists.txt"
    - "OMILRECV2/CMakeLists.txt"
    - "pyproject.toml"
    - "docs/**"
    - "CLAUDE.md"
    - "README.md"
    - ".gitignore"

loop:
  max_rounds: 10
  candidates_per_round: 3
  max_workers: 3

eval:
  commands:
    - "bash scripts/sl_eval_post_v107.sh --evtmax 10"
  metrics:
    objective:
      key: SPEED_MS
      lower_is_better: true
    gates:
      - key: FCN
        description: >
          Likelihood value at 1e-13 drift vs v1.0.7-rev1 (not bit-identical).
          Allows arithmetic simplifications and code cleanup within machine precision.
          The likelihood code lives in OMILRECV2/src/omilrec_charge_ll.cc and
          omilrec_time_pdf.cc.
      - key: CONSISTENCY
        description: >
          Reconstructed physics (vertex/energy/t0/peSum) within 4mm/7keV/10ps/0.1PE
          of v1.0.7-rev1. Allows float op changes as long as physics output stays
          within range. The reconstruction code lives in OMILRECV2/src/omilrec_reconstruction.cc.
      - key: EVAL_RESULT
        description: >
          Eval script completed (fails on build/timeout/crash).

source:
  path: ../../../omilrec-v100-postv107-gated   # real git repo, freshly-prepared gated package
  baseline_ref: postv107-gated-v100            # the prepared start commit
